<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Details</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        align-items: center;

        color: #333;
      }
      .value {
        color: #111;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p><span class="label">Name:</span> <span class="value">Rohan</span></p>
      <p><span class="label">UPI ID:</span> <span class="value">roshan8846@axl</span></p>
    </div>
  </body>
</html>
