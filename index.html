<body>

    <div class="wrapper">
        <!-- HEADER -->
        <div class="header">
            <div class="skull-icon">☠️</div>
            <h1 class="vault-title">CARD <span>VAULT</span></h1>
            <div class="sub-tag">// PAY FIRST &rarr; ENTER UTR &rarr; GET CARD</div>
        </div>

        <!-- FILTERS -->
        <div class="filters-container">
            <div class="filter-row">
                <button class="filter-btn active" onclick="sortCards('asc', this)">💰 LOW &rarr; HIGH</button>
                <button class="filter-btn" onclick="sortCards('desc', this)">💎 HIGH &rarr; LOW</button>
            </div>
            <div class="filter-row">
                <button class="filter-btn active" onclick="filterBrand('ALL', this)">☠️ ALL</button>
                <button class="filter-btn" onclick="filterBrand('VISA', this)">VISA</button>
                <button class="filter-btn" onclick="filterBrand('MC', this)">MC</button>
                <button class="filter-btn" onclick="filterBrand('AMEX', this)">AMEX</button>
                <button class="filter-btn" onclick="filterBrand('DISC', this)">DISC</button>
                <button class="filter-btn" onclick="filterBrand('RUPAY', this)">RUPAY</button>
            </div>
        </div>

        <!-- CARD LIST CONTAINER -->
        <div id="cardList"></div>
    </div>

    <!-- LIVE PAYMENT POPUP MODAL -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal-box">
            <span class="close-modal" onclick="closePayment()">&times;</span>
            <div class="modal-header">💳 PAY & VERIFY</div>
            
            <div class="upi-box" onclick="copyUPI()">
                <span>Rohan: <strong>roshan8846@axl</strong></span> 📋
            </div>
            
            <div class="modal-price" id="modalPrice">₹100</div>

            <div class="qr-wrapper">
                <div class="scanner-line"></div>
                <!-- Dynamic QR pointing to roshan8846@axl with exact amount -->
                <img src="#" id="qrImg" alt="Rohan UPI QR">
            </div>

            <div>
                <div class="timer-badge">⌛ <span id="timer">05:00</span></div>
            </div>

            <input type="text" class="utr-input" placeholder="Enter 12 Digit UTR / Ref Number" id="utrField">
            <button class="verify-btn" onclick="verifyUTR()">✔ VERIFY UTR</button>
        </div>
    </div>

    <script>
        const rawData = [
            { brand: 'VISA', limit: '2,800', price: 100, number: '4111 8392 0192 XXXX', holder: 'ARJUN YADAV' },
            { brand: 'MC', limit: '3,299', price: 150, number: '5368 7965 1152 XXXX', holder: 'VIKRAM SINGH' },
            { brand: 'AMEX', limit: '5,500', price: 220, number: '3782 8221 9012 XXXX', holder: 'RAHUL SHARMA' },
            { brand: 'RUPAY', limit: '8,200', price: 300, number: '6071 8823 4410 XXXX', holder: 'AMIT PATEL' },
            { brand: 'DISC', limit: '12,500', price: 420, number: '6011 9531 3589 XXXX', holder: 'ROHIT KUMAR' },
            { brand: 'VISA', limit: '18,000', price: 550, number: '4532 9901 2231 XXXX', holder: 'KARAN MEHTA' },
            { brand: 'MC', limit: '25,000', price: 750, number: '5241 6620 9811 XXXX', holder: 'DEEPAK VERMA' },
            { brand: 'AMEX', limit: '38,000', price: 980, number: '3714 5510 8820 XXXX', holder: 'SAMEER KHAN' },
            { brand: 'VISA', limit: '55,000', price: 1400, number: '4916 2200 4412 XXXX', holder: 'VISHAL GUPTA' },
            { brand: 'RUPAY', limit: '1,00,000', price: 2200, number: '6521 9911 3340 XXXX', holder: 'ANAND JOSHI' },
            { brand: 'MC', limit: '2,800', price: 100, number: '5105 2201 9931 XXXX', holder: 'PRIYANSHU DAS' },
            { brand: 'VISA', limit: '3,299', price: 150, number: '4222 7710 4482 XXXX', holder: 'MANISH TIWARI' },
            { brand: 'DISC', limit: '5,500', price: 220, number: '6011 4412 8831 XXXX', holder: 'NEERAJ CHOWDHURY' },
            { brand: 'AMEX', limit: '8,200', price: 300, number: '3787 1102 9920 XXXX', holder: 'GAURAV REDDY' },
            { brand: 'RUPAY', limit: '12,500', price: 420, number: '6522 8810 5512 XXXX', holder: 'SACHIN DESHMUKH' },
            { brand: 'VISA', limit: '18,000', price: 550, number: '4026 8812 7731 XXXX', holder: 'YASH MALHOTRA' },
            { brand: 'MC', limit: '25,000', price: 750, number: '5412 3390 1120 XXXX', holder: 'KUNAL BANSAL' },
            { brand: 'AMEX', limit: '38,000', price: 980, number: '3742 9901 3310 XXXX', holder: 'ABHISHEK ROY' },
            { brand: 'VISA', limit: '55,000', price: 1400, number: '4312 6621 8890 XXXX', holder: 'TARUN MISHRA' },
            { brand: 'MC', limit: '1,00,000', price: 2200, number: '5520 8812 4430 XXXX', holder: 'DEVENDRA RAO' }
        ];

        let currentData = [...rawData];
        let timerInterval;

        function renderCards(data) {
            const container = document.getElementById('cardList');
            container.innerHTML = '';
            
            data.forEach(item => {
                const cardHtml = `
                    <div class="card-vault-item">
                        <div class="card-top-bar">
                            <span class="card-brand">${item.brand}</span>
                            <span class="card-price-tag">₹${item.price}</span>
                        </div>
                        <div class="card-number-box">${item.number}</div>
                        <div class="card-info-grid">
                            <div class="info-cell">
                                <div class="cell-label">EXP</div>
                                <div class="cell-value">XX/XXXX</div>
                            </div>
                            <div class="info-cell">
                                <div class="cell-label">LIMIT</div>
                                <div class="cell-value bal">₹${item.limit}</div>
                            </div>
                        </div>
                        <div class="holder-name">${item.holder}</div>
                        <button class="buy-btn" onclick="openPayment('${item.brand}', ${item.price})">💳 BUY • ₹${item.price}</button>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function filterBrand(brand, btn) {
            document.querySelectorAll('.filter-row:nth-child(2) .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(brand === 'ALL') {
                currentData = [...rawData];
            } else {
                currentData = rawData.filter(item => item.brand === brand);
            }
            renderCards(currentData);
        }

        function sortCards(order, btn) {
            document.querySelectorAll('.filter-row:nth-child(1) .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(order === 'asc') {
                currentData.sort((a, b) => a.price - b.price);
            } else {
                currentData.sort((a, b) => b.price - a.price);
            }
            renderCards(currentData);
        }

        function openPayment(brand, price) {
            document.getElementById('modalPrice').innerText = '₹' + price;
            
            // Dynamic UPI QR generation for roshan8846@axl
            const upiString = `upi://pay?pa=roshan8846@axl&pn=Rohan&am=${price}&cu=INR`;
            const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiString)}`;
            
            document.getElementById('qrImg').src = qrApi;
            document.getElementById('paymentModal').style.display = 'flex';
            startTimer(300);
        }

        function closePayment() {
            document.getElementById('paymentModal').style.display = 'none';
            clearInterval(timerInterval);
        }

        function copyUPI() {
            navigator.clipboard.writeText('roshan8846@axl');
            alert('UPI ID copied to clipboard: roshan8846@axl');
        }

        function startTimer(duration) {
            clearInterval(timerInterval);
            let timer = duration, minutes, seconds;
            const display = document.getElementById('timer');
            
            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    display.textContent = "00:00";
                }
            }, 1000);
        }

        function verifyUTR() {
            const utr = document.getElementById('utrField').value.trim();
            if(!utr || utr.length < 10) {
                alert("Please enter a valid 12-digit UTR/Ref number!");
                return;
            }
            alert("UTR " + utr + " submitted successfully. Card details will be generated!");
            closePayment();
        }

        // Initial Load
        renderCards(currentData);
    </script>
</body>
